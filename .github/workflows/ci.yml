name: protocol-contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: make check
      - run: python -m pip install -r examples/requirements.txt
      - run: make integration
      - run: docker compose up --build --wait
      - run: python examples/chat.py
      - if: always()
        run: docker compose logs && docker compose down
