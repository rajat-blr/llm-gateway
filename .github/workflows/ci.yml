name: protocol-contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/demo_test.cjs
      - run: test -z "$(gofmt -l cmd internal)"
      - run: make check
      - run: python -m pip install -r examples/requirements.txt
      - run: make integration
      - run: python scripts/harness_test.py
      - run: go test ./internal/gateway -run '^$' -fuzz FuzzStrictJSONEquivalent -fuzztime 10s -parallel 2
      - run: python scripts/release_load.py --runs 1 --seconds 0.2 --max-concurrency 10 --output tmp/release-load-smoke.json
      - run: python scripts/resource_soak.py --seconds 2 --runs 1 --concurrency 4 --slow-rounds 1 --output tmp/resource-soak-smoke.json
      - run: python scripts/load_baseline.py --duration 0.2 --runs 1 --concurrency 1 4 --soak-rounds 2 --soak-concurrency 4
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-smoke
          path: |
            tmp/baseline.json
            tmp/release-load-smoke.json
            tmp/resource-soak-smoke.json
      - run: docker compose up --build --wait
      - run: DEMO_BASE_URL=http://localhost:8080 node --test scripts/demo_test.cjs
      - run: python examples/chat.py
      - run: python scripts/compose_acceptance.py normal
      - run: python scripts/admin_demo.py
      - run: python scripts/reuse_demo.py
      - run: docker compose --profile monitoring up -d --wait
      - run: python scripts/monitoring_acceptance.py
      - run: MOCK_FAIL_EVERY=1 docker compose up -d --no-deps --force-recreate --wait mock gateway
      - run: python scripts/compose_acceptance.py fallback
      - run: MOCK_DROP_AFTER=1 docker compose up -d --no-deps --force-recreate --wait mock gateway
      - run: python scripts/compose_acceptance.py drop
      - run: python scripts/admin_demo.py --expect-previous
      - run: python scripts/redis_outage_acceptance.py
      - if: always()
        run: docker compose --profile monitoring logs && docker compose --profile monitoring down
