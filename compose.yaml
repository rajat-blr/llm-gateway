services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
  mock:
    build: .
    entrypoint: ["mock"]
    command: ["-listen", ":9090", "-fail-every", "${MOCK_FAIL_EVERY:-0}", "-drop-after", "${MOCK_DROP_AFTER:-0}", "-chunk-delay", "${MOCK_CHUNK_DELAY:-30ms}"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
  mock-secondary:
    build: .
    entrypoint: ["mock"]
    command: ["-listen", ":9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
  gateway:
    build: .
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-demo-local-key}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-demo-local-admin-token}
      MOCK_API_KEY: fixture-only
    volumes:
      - gateway-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mock-secondary:
        condition: service_healthy
      mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 1s
      retries: 10
    stop_grace_period: 12s

volumes:
  redis-data:
  gateway-data:
