services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
  mock:
    build: .
    entrypoint: ["mock"]
    command: ["-listen", ":9090", "-fail-every", "${MOCK_FAIL_EVERY:-0}", "-drop-after", "${MOCK_DROP_AFTER:-0}", "-chunk-delay", "${MOCK_CHUNK_DELAY:-30ms}"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
  mock-secondary:
    build: .
    entrypoint: ["mock"]
    command: ["-listen", ":9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 1s
      retries: 10
  gateway:
    build: .
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-demo-local-key}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-demo-local-admin-token}
      MOCK_API_KEY: fixture-only
    volumes:
      - gateway-data:/app/data
      - ./configs:/app/configs:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9095:9095"
    depends_on:
      redis:
        condition: service_healthy
      mock-secondary:
        condition: service_healthy
      mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 1s
      retries: 10
    stop_grace_period: 12s

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=2h", "--storage.tsdb.retention.size=256MB"]
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9096:9090"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 1s
      retries: 20
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-demo-local-grafana-password}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 1s
      retries: 30

volumes:
  redis-data:
  gateway-data:
  prometheus-data:
  grafana-data:
